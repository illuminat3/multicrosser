version: '3.8'

services:
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    image: registry.illuminat3.xyz/multisetter:latest
    command: bundle exec puma -C config/puma.rb
    ports:
      - "9999:3000"
    environment:
      - RAILS_ENV=production
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-change_me_in_production}
    depends_on:
      - redis

volumes:
  redis_data:
